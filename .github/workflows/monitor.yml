name: Monitor Gincataí

on:
  # Disparo externo a cada 1 min (cron-job.org -> API do GitHub). Ver README.
  workflow_dispatch:
  # Backup nativo do GitHub (mínimo 5 min; na prática pode atrasar)
  schedule:
    - cron: "*/5 * * * *"

# Nunca roda duas verificações ao mesmo tempo (evita aviso duplicado)
concurrency:
  group: monitor-gincatai
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verificar site
        env:
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_CHATS: ${{ secrets.GREEN_API_CHATS }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          CALLMEBOT_RECIPIENTS: ${{ secrets.CALLMEBOT_RECIPIENTS }}
        run: python monitor.py

      - name: Salvar estado
        run: |
          git config user.name "gincatai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "estado: $(date -u +%FT%TZ)"
            git pull --rebase -X theirs || true
            git push
          fi
